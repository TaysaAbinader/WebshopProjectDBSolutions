# Server Configuration
# Configured to 8085 by default because port 8080 is occupied by Jenkins
server.port=${PORT:8085}

# Application Info
spring.application.name=webshop-api

# Database Connection (MariaDB / MySQL)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:project}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Shahid75}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA & Hibernate Settings
# none ensures Spring Boot does not drop or modify existing production tables and views
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Preserve exact table names as annotated (@Table(name = "ProductCategories"), etc.)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

