components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide your JWT bearer token in the format `Bearer <token>` to access protected endpoints.
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_PARAMETER
        message:
          type: string
          example: The category_id field is required.
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Gadgets, devices, and electronic accessories.
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Gadgets, devices, and electronic accessories.
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock_quantity
        - category_id
        - supplier_id
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: Wireless Noise-Canceling Headphones
        description:
          type: string
          nullable: true
          example: High-fidelity audio with active noise-canceling technology.
        price:
          type: number
          minimum: 0.01
          example: 199.99
        stock_quantity:
          type: integer
          minimum: 0
          example: 45
        category_id:
          type: integer
          example: 10
        supplier_id:
          type: integer
          example: 501
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T01:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T01:00:00Z'
    ProductInput:
      type: object
      required:
        - name
        - price
        - stock_quantity
        - category_id
        - supplier_id
      properties:
        name:
          type: string
          example: Wireless Noise-Canceling Headphones
        description:
          type: string
          nullable: true
          example: High-fidelity audio with active noise-canceling technology.
        price:
          type: number
          minimum: 0.01
          example: 199.99
        stock_quantity:
          type: integer
          minimum: 0
          example: 45
        category_id:
          type: integer
          example: 10
        supplier_id:
          type: integer
          example: 501
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          example: Wireless Noise-Canceling Headphones
        description:
          type: string
          nullable: true
          example: Updated high-fidelity audio headphones description.
        price:
          type: number
          minimum: 0.01
          example: 189.99
        stock_quantity:
          type: integer
          minimum: 0
          example: 50
        category_id:
          type: integer
          example: 10
        supplier_id:
          type: integer
          example: 501
    Customer:
      type: object
      required:
        - id
        - first_name
        - last_name
        - email
      properties:
        id:
          type: integer
          example: 1001
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: alice.smith@example.com
        phone:
          type: string
          nullable: true
          example: +1-555-0199
        created_at:
          type: string
          format: date-time
          example: '2026-01-15T08:30:00Z'
    CustomerInput:
      type: object
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: alice.smith@example.com
        phone:
          type: string
          nullable: true
          example: +1-555-0199
    Address:
      type: object
      required:
        - id
        - street
        - city
        - state
        - postal_code
        - country
      properties:
        id:
          type: integer
          example: 2001
        street:
          type: string
          example: 123 Main Street
        city:
          type: string
          example: Seattle
        state:
          type: string
          example: WA
        postal_code:
          type: string
          example: '98101'
        country:
          type: string
          example: USA
        is_default:
          type: boolean
          example: true
    AddressInput:
      type: object
      required:
        - street
        - city
        - state
        - postal_code
        - country
      properties:
        street:
          type: string
          example: 123 Main Street
        city:
          type: string
          example: Seattle
        state:
          type: string
          example: WA
        postal_code:
          type: string
          example: '98101'
        country:
          type: string
          example: USA
        is_default:
          type: boolean
          default: false
          example: true
    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - unit_price
      properties:
        product_id:
          type: integer
          example: 101
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit_price:
          type: number
          minimum: 0.01
          example: 199.99
    OrderItemInput:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          example: 101
        quantity:
          type: integer
          minimum: 1
          example: 2
    Order:
      type: object
      required:
        - id
        - customer_id
        - shipping_address_id
        - status
        - items
        - total_amount
        - created_at
      properties:
        id:
          type: integer
          example: 50001
        customer_id:
          type: integer
          example: 1001
        shipping_address_id:
          type: integer
          example: 2001
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - cancelled
          example: pending
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          minimum: 0.01
          example: 399.98
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T01:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T01:05:00Z'
    OrderInput:
      type: object
      required:
        - customer_id
        - shipping_address_id
        - items
      properties:
        customer_id:
          type: integer
          example: 1001
        shipping_address_id:
          type: integer
          example: 2001
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - cancelled
          example: shipped
    Supplier:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 501
        name:
          type: string
          example: Apex Tech Suppliers
        contact_name:
          type: string
          nullable: true
          example: John Doe
        email:
          type: string
          nullable: true
          format: email
          example: contact@apextech.com
        phone:
          type: string
          nullable: true
          example: +1-800-555-0199
    SupplierInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Apex Tech Suppliers
        contact_name:
          type: string
          nullable: true
          example: John Doe
        email:
          type: string
          nullable: true
          format: email
          example: contact@apextech.com
        phone:
          type: string
          nullable: true
          example: +1-800-555-0199
